<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#4DB8FF" />
    <title>Tersesat di awan — SKYFOLIO</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: 'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #2b2d42;
        background: linear-gradient(180deg, #4db8ff 0%, #bde8ff 60%, #fff6e6 100%);
      }
      .card {
        width: min(460px, 100%);
        background: rgba(255, 246, 230, 0.96);
        border-radius: 28px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 14px 40px rgba(43, 45, 66, 0.22);
      }
      .cloud {
        width: 120px;
        height: 70px;
        margin: 0 auto 10px;
      }
      h1 {
        font-family: Fredoka, 'Nunito Sans', system-ui, sans-serif;
        font-size: 30px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 18px;
        line-height: 1.5;
      }
      .en {
        color: #5d6178;
        font-size: 14px;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 16px;
        font-weight: 700;
        text-decoration: none;
        color: #2b2d42;
        background: #ffc93c;
      }
      a.ghost {
        background: rgba(43, 45, 66, 0.08);
      }
      a:focus-visible {
        outline: 3px solid #2f8fa6;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="cloud" viewBox="0 0 120 70" aria-hidden="true">
        <ellipse cx="38" cy="44" rx="26" ry="20" fill="#fff" />
        <ellipse cx="66" cy="34" rx="30" ry="26" fill="#fff" />
        <ellipse cx="92" cy="46" rx="22" ry="17" fill="#fff" />
        <rect x="16" y="44" width="96" height="20" rx="10" fill="#fff" />
        <circle cx="56" cy="40" r="3" fill="#2b2d42" />
        <circle cx="74" cy="40" r="3" fill="#2b2d42" />
        <path d="M58 50c4 3 10 3 14 0" fill="none" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round" />
      </svg>
      <h1>Ups, kita tersesat di awan!</h1>
      <p>Halaman yang Kakak cari tidak ada. Yuk kembali ke landasan.</p>
      <p class="en">Oops, we got lost in the clouds. This page doesn't exist.</p>
      <div class="btns">
        <a href="/">Kembali terbang</a>
        <a class="ghost" href="/ringkas/">Mode Ringkas</a>
      </div>
    </main>
  </body>
</html>
