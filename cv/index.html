<!doctype html>
<html lang="id" data-lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV — Syahril Maimubdy</title>
    <meta name="description" content="CV Syahril Maimubdy (Aril), mahasiswa Ilmu Komputer Universitas Sumatera Utara." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/boot/cv.js"></script>
    <style>
      @page {
        size: A4;
        margin: 14mm 15mm;
      }
      [data-l] {
        display: none;
      }
      html[data-lang='id'] [data-l='id'],
      html[data-lang='en'] [data-l='en'] {
        display: revert;
      }
      body {
        margin: 0;
        background: #eef3f8;
        color: #22243a;
        font: 10.5pt/1.45 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;
      }
      .cv {
        max-width: 190mm;
        margin: 16px auto;
        background: #fff;
        padding: 14mm 15mm;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }
      header {
        border-bottom: 3px solid #ffc93c;
        padding-bottom: 8px;
        margin-bottom: 6px;
      }
      h1 {
        font-family: 'Fredoka', 'Nunito Sans', system-ui, sans-serif;
        font-size: 24pt;
        margin: 0;
        letter-spacing: 0.3px;
      }
      .role {
        margin: 2px 0 6px;
        color: #3a3d55;
        font-weight: 700;
      }
      .contact {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
        font-size: 9.5pt;
      }
      .contact span {
        color: #6a6e86;
      }
      a {
        color: #1f74c9;
        text-decoration: none;
      }
      h2 {
        font-family: 'Fredoka', 'Nunito Sans', system-ui, sans-serif;
        font-size: 12.5pt;
        color: #1f74c9;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin: 14px 0 6px;
        border-bottom: 1px solid #dce6f2;
        padding-bottom: 2px;
      }
      .entry {
        margin: 0 0 8px;
        break-inside: avoid;
      }
      .entry-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .when {
        color: #6a6e86;
        white-space: nowrap;
        font-size: 9.5pt;
      }
      .org {
        color: #4a4e66;
        font-style: italic;
      }
      p {
        margin: 2px 0;
      }
      .skills {
        margin: 3px 0;
      }
      .toolbar {
        max-width: 190mm;
        margin: 16px auto 0;
        padding: 0 16px;
        box-sizing: border-box;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar a,
      .toolbar button {
        font: 700 14px system-ui, sans-serif;
        background: #ffc93c;
        color: #22243a;
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        min-height: 44px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
      .toolbar a:focus-visible,
      .toolbar button:focus-visible {
        outline: 3px solid #2f8fa6;
        outline-offset: 2px;
      }
      @media print {
        body {
          background: #fff;
        }
        .cv {
          margin: 0;
          padding: 0;
          box-shadow: none;
          max-width: none;
        }
        .toolbar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="toolbar" aria-label="CV">
      <a href="/">← SKYFOLIO</a>
      <a href="?lang=id">Bahasa Indonesia</a>
      <a href="?lang=en">English</a>
      <button type="button" data-print>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V3h10v6" /><rect x="3" y="9" width="18" height="8" rx="2" /><path d="M7 14h10v7H7z" /></svg>
        Cetak / Print
      </button>
    </nav>
    <!--SKYFOLIO:CV-->
  </body>
</html>
